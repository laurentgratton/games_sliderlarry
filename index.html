<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A small, cheerful collection of games made with care." />
    <title>Play Patch ✦ Tiny games, big smiles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="site-title">
        <div class="sparkle sparkle-one">✦</div>
        <div class="sparkle sparkle-two">✧</div>
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <p class="eyebrow"><span>✦</span> made with playful pixels</p>
        <h1 id="site-title">Welcome to<br /><span>Play Patch!</span></h1>
        <p class="intro">A sunny little shelf for the games we make. Pick a tile, press play, and have a lovely time.</p>
        <a class="jump-link" href="#games">See the games <span aria-hidden="true">↓</span></a>
        <div class="mascot" aria-hidden="true"><div class="ear ear-left"></div><div class="ear ear-right"></div><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="smile"></i></div></div>
        <div class="hill hill-back"></div><div class="hill hill-front"></div>
      </section>

      <section class="games" id="games" aria-labelledby="games-title">
        <div class="section-heading"><div><p class="eyebrow">our little collection</p><h2 id="games-title">Pick a game!</h2></div><span class="flower" aria-hidden="true">✿</span></div>
        <div class="game-grid" id="game-grid" aria-live="polite"></div>
      </section>
    </main>
    <footer><span>Made with <b>♥</b> and a few too many snacks.</span><span>Come play again soon! ✦</span></footer>
    <template id="game-card-template">
      <article class="game-card">
        <div class="art" aria-hidden="true"><span class="art-icon"></span><span class="art-shape"></span></div>
        <div class="card-content"><span class="tag"></span><h3></h3><p></p><a class="play-button">Play now <span aria-hidden="true">→</span></a></div>
      </article>
    </template>
    <script src="games.js"></script>
  </body>
</html>
