name: Update Gardens and Golems

on:
  repository_dispatch:
    types: [gardens-and-golems-updated]

permissions:
  contents: write

concurrency:
  group: update-gardens-and-golems
  cancel-in-progress: false

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Update Gardens and Golems
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --remote games/gardens-and-golems
          if git diff --quiet -- games/gardens-and-golems; then
            echo "Gardens and Golems is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/gardens-and-golems
          git commit -m "chore: update Gardens and Golems"
          git push
