name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [game-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site and games
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN }}
          persist-credentials: false

      - name: Refresh game releases
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$SUBMODULE_READ_TOKEN" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" submodule update --remote --recursive
          git submodule status --recursive

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble publishable site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
